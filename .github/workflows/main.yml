name: Main Workflow

on:
  push:
    branches:
      - main

jobs:
    build-and-test:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: ./CI-CD
        steps:
            - uses: actions/checkout@v4
            - name: Call Reusable CI-CD Workflow
              uses: ./.github/workflows/CI-CD.yml
